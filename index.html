<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>JJ's BirdBuster</title>
  <meta name="description" content="A special pixel adventure. Best on a phone, held sideways." />
  <meta name="theme-color" content="#0b0a12" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/page/icon.png" />
  <link rel="apple-touch-icon" href="/assets/page/touch_icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="JJ's BirdBuster" />
  <meta property="og:description" content="A special pixel adventure. Best on a phone, held sideways." />
  <meta property="og:url" content="https://xshadoweagle.github.io/jjs-birdbuster/" />
  <meta property="og:image" content="https://xshadoweagle.github.io/jjs-birdbuster/assets/page/preview.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="632" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    html, body { margin: 0; padding: 0; background: #0b0a12; height: 100%; overflow: hidden; }
    body { height: 100dvh; }
    body { display: flex; align-items: center; justify-content: center; touch-action: none; -webkit-user-select: none; user-select: none; }
    #game { width: 100%; height: 100%; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    #loading, #asleep { --k: 3; position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(6px * var(--k)); background: #0b0a12; }
    #loading img, #asleep img { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    #loading .bird { width: calc(40px * var(--k)); height: calc(40px * var(--k)); overflow: hidden; }
    #loading .bird img { height: 100%; animation: run 0.43s steps(6) infinite; }
    @keyframes run { from { transform: translateX(calc(-80px * var(--k))); } to { transform: translateX(calc(-320px * var(--k))); } }
    #loading .words { height: calc(24px * var(--k)); }
    #loading .bar { width: calc(80px * var(--k)); height: calc(3px * var(--k)); background: #3a3050; }
    #loading .bar i { display: block; width: 0; height: 100%; background: #ffd35a; }
    @media (min-height: 600px) { #loading { --k: 4; } }
    @media (min-height: 1000px) { #loading { --k: 6; } }
    #loading[hidden], #asleep[hidden], #asleep [hidden] { display: none; }
    #asleep { --k: 2; }
    #asleep.napping { cursor: pointer; }
    #asleep .bird { position: relative; width: calc(72px * var(--k)); height: calc(44px * var(--k)); overflow: hidden; }
    #asleep .bird img { position: absolute; top: 0; left: 0; height: 100%; }
    #asleep .bird .asleep { animation: nap 2.4s steps(8) infinite; }
    @keyframes nap { to { transform: translateX(calc(-576px * var(--k))); } }
    #asleep .bird .poked, #asleep .bird .waking, #asleep .bird.poked .asleep, #asleep .bird.waking .asleep { visibility: hidden; }
    #asleep .bird .poked { height: 400%; top: calc(-44px * var(--k) * var(--row, 0)); }
    #asleep .bird.poked .poked { visibility: visible; animation: poked 0.4s steps(4, jump-none) forwards; }
    @keyframes poked { to { transform: translateX(calc(-216px * var(--k))); } }
    #asleep .bird.waking .waking { visibility: visible; animation: waking 1.5s steps(12, jump-none) forwards; }
    @keyframes waking { to { transform: translateX(calc(-792px * var(--k))); } }
    #asleep .words { height: calc(54px * var(--k)); }
    @media (min-width: 560px) and (min-height: 350px) { #asleep { --k: 3; } }
    @media (min-width: 760px) and (min-height: 600px) { #asleep { --k: 4; } }
    @media (min-width: 1100px) and (min-height: 1000px) { #asleep { --k: 6; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="loading" hidden>
    <div class="bird"><img src="/assets/characters/bird_solo.png" alt="" /></div>
    <div class="bar"><i></i></div>
    <img class="words" src="/assets/page/loading.png" alt="Loading" />
  </div>
  <div id="asleep" hidden>
    <div class="bird">
      <img class="asleep" src="/assets/page/asleep.png" alt="" loading="lazy" />
      <img class="poked" src="/assets/page/poked.png" alt="" loading="lazy" />
      <img class="waking" src="/assets/page/waking.png" alt="" loading="lazy" />
    </div>
    <img class="words deep" src="/assets/page/asleep_words.png" alt="Bobo is fast asleep... come back later!" loading="lazy" hidden />
    <img class="words nap" src="/assets/page/napping_words.png" alt="Bobo is napping... poke him awake!" loading="lazy" hidden />
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
