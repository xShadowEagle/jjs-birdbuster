<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BirdBuster Workbench</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0a12; color: #fff8e0; font: 12px/1.4 ui-monospace, Consolas, monospace; }
    body { display: flex; overflow: hidden; }
    #panel { width: 220px; flex: none; box-sizing: border-box; padding: 10px; overflow-y: auto; background: #1a1020; border-right: 1px solid #3a3050; }
    #stage { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    #game { flex: 1; min-height: 0; padding: 12px; display: flex; align-items: center; justify-content: center; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    h1 { font-size: 12px; color: #ffd35a; margin: 0 0 8px; letter-spacing: 1px; }
    h1 a { color: #cfc3a0; font-weight: normal; letter-spacing: 0; }
    h2 { font-size: 10px; color: #ffd35a; margin: 12px 0 4px; letter-spacing: 1px; font-weight: normal; }
    select, button { font: inherit; color: #fff8e0; background: #2a2036; border: 1px solid #3a3050; border-radius: 3px; padding: 2px 5px; }
    select { width: 100%; }
    button { cursor: pointer; margin: 0 3px 5px 0; }
    button.on { border-color: #ffd35a; color: #ffd35a; }
    .row { display: flex; flex-wrap: wrap; }
    .hint { color: #cfc3a0; margin-top: 12px; white-space: pre; }
    #texts { display: none; overflow-y: auto; padding: 0 12px 40vh; border-top: 1px solid #3a3050; }
    body.texts #game { flex: 0 0 46%; }
    body.texts #texts { display: block; flex: 1; }
    #texts h3 { font-size: 11px; color: #ffd35a; margin: 16px 0 4px; letter-spacing: 1px; font-weight: normal; scroll-margin-top: 32px; }
    .text { scroll-margin-top: 32px; display: grid; grid-template-columns: 160px 1fr 1fr; gap: 8px; padding: 4px 6px; border-radius: 3px; }
    .text.on { background: #1a1020; }
    .text.head { position: sticky; top: 0; z-index: 1; background: #0b0a12; color: #ffd35a; padding: 6px; }
    .text[hidden], #texts h3[hidden] { display: none; }
    #texts-none { color: #8a7f9a; padding: 16px 6px; }
    .key { color: #cfc3a0; overflow-wrap: anywhere; }
    textarea { font: inherit; color: #fff8e0; background: #2a2036; border: 1px solid #3a3050; border-radius: 3px; padding: 3px 5px; width: 100%; box-sizing: border-box; resize: none; field-sizing: content; min-height: 24px; }
    textarea:focus { outline: none; border-color: #ffd35a; }
    textarea.dirty { border-color: #e8833c; }
    textarea::placeholder { color: #8a7f9a; }
    .status { font-size: 11px; color: #8a7f9a; min-height: 14px; }
    .status.bad { color: #ff7070; }
    .status.saved { color: #7bd88f; }
  </style>
</head>
<body>
  <aside id="panel"></aside>
  <div id="stage">
    <main id="game"></main>
    <section id="texts"></section>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
